name: Import Roblox 2008 assets
on:
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download archived CSS, JavaScript and images
        run: python3 tools/import_wayback_assets.py
      - name: Commit mirrored assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Roblox 2008 Wayback assets"
            git push
          fi
