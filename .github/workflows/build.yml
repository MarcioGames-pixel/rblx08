name: PHP checks and ZIP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql
          coverage: none
      - name: PHP syntax check
        run: |
          set -e
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
      - name: Check asset importer syntax
        run: python3 -m py_compile tools/import_assets.py
      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/rblx08.zip . -x '.git/*' 'config.php' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: rblx08-build
          path: dist/*.zip
          retention-days: 30
