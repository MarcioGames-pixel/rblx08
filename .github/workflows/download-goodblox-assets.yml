name: Download Goodblox static assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download original static assets
        run: python3 tools/download_goodblox_assets.py
      - name: Download original 2008 ROBLOX logo from Wayback Machine
        run: python3 tools/download_wayback_logo.py
      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AllCSSnew.css images assets/goodblox-manifest.json
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Download Goodblox legacy static assets"
            git push
          fi
